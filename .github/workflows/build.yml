name: Build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
          fi

      - name: Build release with dev signing
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --build-cache -PDEV_SIGNING=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Publish to Develop prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd app/build/outputs/apk/release
          if ! gh release view Develop > /dev/null 2>&1; then
            gh release create Develop --prerelease --title "Dev" --notes "dev分支自动构建"
          fi
          gh release upload Develop *.apk --clobber
