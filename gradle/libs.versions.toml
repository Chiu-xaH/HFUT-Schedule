# 还是动了，需要用其中最新的API实现形状插值，妈的真SB，全屏可滚动内容在BottomSheet中滑动到顶或者底时会顿一下，弄个BottomSheet总特么改
# 整个聚在工大随material3升级的时候BottomSheet大改了两次，非必要千万不要再升级了，不想来第三次重适配了
material3 = "1.5.0-alpha12"
# Nav2就是一坨答辩，尽管再封装了一次，也只勉强用了 4.17 4.18 4.19 三个大版本，随着SharedNav的开发完成，Nav2在项目中的占比很小了，只剩下一小部分负责管理平切场景的导航（带BottomBar的页面），等后续SharedNav继续迭代接管此功能就可以删了
#navigationCompose = "2.7.5" # 2.9.1 2.7.5
navigationComposeVersion = "2.7.0-alpha07" # 2.9.0-beta04
okhttp = "4.9.0"
palette = "1.0.0"
profileinstaller = "1.4.1"
